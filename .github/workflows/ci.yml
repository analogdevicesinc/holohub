name: CI

on:
  push:
    branches: [iio-controller-module]
  pull_request:
    branches: [iio-controller-module]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Python lint
        run: ruff check .
      - name: Validate metadata.json against the Holoscan CLI schema
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
        run: |
          pip install 'holoscan-cli[create]' -c requirements-cli.txt
          python .github/workflows/scripts/validate_metadata.py
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: C++ format check
        run: |
          find operators applications \
               -name '*.cpp' -o -name '*.hpp' -o -name '*.cu' \
            | xargs clang-format --dry-run --Werror

