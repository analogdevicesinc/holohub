# Development tooling only. This Module's C++ operators ship with pybind11
# Python bindings built alongside them via CMake; this file pins the Holoscan
# CLI for `uv run holoscan ...` and configures ruff for the repository's
# helper scripts. The CLI version is pinned to 4.6.0 to match this module's
# actual Holoscan SDK target (see metadata.json) and the CLI version already
# bundled in that SDK's own container image.

[project]
name = "holoscan-iio-controller"
version = "1.0.0"
description = "IIO Controller operators for Analog Devices SDR hardware (ADALM-Pluto) via libiio v0/v1"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Andrei-Fabian Pop" },
    { name = "Marius Lucacel" },
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "holoscan-cli==4.6.0",
    "ruff",
    "pytest",
]

[tool.uv]
# Not an installable Python package; `uv sync` only provisions the dev tools.
package = false

[tool.uv.sources]
holoscan-cli = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.holoscan]
# Module-wide defaults for `holoscan build|run|test|run-container`. See DEVELOPER.md
# for the full list of supported keys. Keep the CUDA major and base images in step
# with the Dockerfile's default BASE_IMAGE.
cuda = 13
# ctest-script = "ci/container.ctest"
# forward-env = ["IS_CI_BUILD"]
# docker-build-args = ["--build-arg", "PROJECT_FEATURE=ON"]
# docker-run-args = ["--network=host"]

[tool.holoscan.base-images]
x86_64 = "nvcr.io/nvidia/clara-holoscan/holoscan:v4.6.0-cuda13"

[tool.ruff]
line-length = 100
target-version = "py312"
# build*/, dist/ are CMake/packaging outputs; .local/, .cache/, .cupy/ are
# dev-container HOME junk.
exclude = [
    "build*",
    "dist",
    ".cache",
    ".local",
    ".cupy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["holoscan"]
