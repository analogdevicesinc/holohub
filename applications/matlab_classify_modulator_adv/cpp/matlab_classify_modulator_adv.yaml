---
multithreaded: true
num_delay_ops: 32
delay: 0.1
delay_step: 0.01

scheduler:
  check_recession_period_ms: 0
  worker_thread_number: 5
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

advanced_network:
  cfg:
    version: 1
    manager: "dpdk"
    master_core: 3
    debug: true
    log_level: "debug"

    memory_regions:
    - name: "Data_RX_CPU"
      kind: "huge"
      affinity: 0
      access:
        - local
      num_bufs: 8192   # 3 x batch_size
      buf_size: 8234

    interfaces:
    - name: data2
      address: 0000:17:00.0
      flow_isolation: true
      rx:
        - queues:
          - name: "Data"
            id: 0
            cpu_core: 8
            batch_size: 256
            output_port: "adv_rx_out"
            memory_regions:
              - "Data_RX_CPU"
          flows:
            - name: "Complex IQ Samples"
              id: 0
              action:
                type: queue
                id: 0
              match:
                udp_src: 4660
                udp_dst: 22136

bench_rx:
  gpu_direct: false         # Set to true if using a GPU region for the Rx queues.
  split_boundary: false     # Byte boundary where header and data is split, 0 if no split
  batch_size: 256
  max_packet_size: 8234
  header_size: 0
  out_file: "modulation_results.txt"
